server {
    # Listen on port 80
    listen 80;
    server_name localhost;

    # Set the web root where portfolio files are located
    root /usr/share/nginx/html;
    # Use index.html as the default document
    index index.html;

    # Handle main routing, matching Netlify's 404 redirect behavior (/* /index.html 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Add reasonable caching headers for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|mp4|webm)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Fallback for missing static assets
        try_files $uri $uri/ /index.html;
    }
}
